name: Release

# Publishes @shieldlabs-ai/node to npm when a maintainer pushes a tag such as v1.0.0.
# The first job checks and packs the package with read-only permissions; the second publishes
# that tarball with provenance (environment "npm", NPM_TOKEN secret). Safe to re-run: a version
# that is already on npm is skipped.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Check and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag does not match the package.json version ${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm run test:runtime
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: shieldlabs-ai-node-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -n "$(npm view "@shieldlabs-ai/node@${VERSION}" version 2>/dev/null)" ]; then
            echo "@shieldlabs-ai/node@${VERSION} is already on npm: nothing to publish."
            exit 0
          fi
          npm publish "shieldlabs-ai-node-${VERSION}.tgz" --provenance --access public
